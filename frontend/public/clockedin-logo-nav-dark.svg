<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 60" width="280" height="60">
  <defs>
    <linearGradient id="arcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4ade80"/>
      <stop offset="100%" style="stop-color:#86efac"/>
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="30" cy="30" r="22" fill="#14532d" opacity="0.4" stroke="#4ade80" stroke-width="1.5"/>

  <!-- Arc -->
  <path d="M 27.9 51.9 A 22 22 0 1 1 32.1 51.9"
        fill="none"
        stroke="url(#arcGrad)"
        stroke-width="3"
        stroke-linecap="round"/>

  <!-- Arrowhead -->
  <g transform="translate(32.1, 51.9) rotate(265)">
    <polygon points="0,-5 3,2.5 -3,2.5" fill="#4ade80"/>
  </g>

  <!-- Tick marks -->
  <g stroke="#86efac" stroke-width="1.5" stroke-linecap="round">
    <line x1="30" y1="10" x2="30" y2="14"/>
    <line x1="50" y1="30" x2="46" y2="30"/>
    <line x1="30" y1="50" x2="30" y2="46"/>
    <line x1="10" y1="30" x2="14" y2="30"/>
  </g>

  <!-- Hour hand -->
  <line x1="30" y1="30" x2="19" y2="20" stroke="#86efac" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Minute hand -->
  <line x1="30" y1="30" x2="33" y2="11" stroke="#4ade80" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Center dot -->
  <circle cx="30" cy="30" r="2.5" fill="#4ade80"/>

  <!-- Brand name - vertically centered -->
  <text x="64" y="38" font-family="Nunito, Verdana, sans-serif" font-weight="800" font-size="26" letter-spacing="-0.5">
    <tspan fill="#86efac">c</tspan><tspan fill="#4ade80">L</tspan><tspan fill="#86efac">ocked</tspan><tspan fill="#4ade80">In</tspan>
  </text>
</svg>
